<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 725" width="1100" height="725" role="img" aria-label="The policy network: 67 numbers describing how the car is moving, the line, its sensors, the asked pace, the car itself and the asked skill are scaled, pass through two layers of 128 units, and come out as steering, pedal and brake, which the plugin applies through its own vehicle model every server tick before the loop repeats.">
<style>
  svg { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --box:#f6f8fa; --line:#d1d9e0; --accent:#0969da; --accentfill:#ddf4ff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --box:#161b22; --line:#3d444d; --accent:#4493f8; --accentfill:#0c2d6b; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--line); stroke-width:1; }
  .abox { fill:var(--accentfill); stroke:var(--accent); stroke-width:1.2; }
  .t { fill:var(--fg); font:600 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif; }
  .d { fill:var(--muted); font:11.5px -apple-system,Segoe UI,Helvetica,Arial,sans-serif; }
  .n { fill:var(--muted); font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .h { fill:var(--fg); font:600 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif; }
  .w { stroke:var(--accent); stroke-width:0.6; opacity:0.28; }
  .ln { stroke:var(--muted); stroke-width:1.3; fill:none; }
  .node { fill:var(--accentfill); stroke:var(--accent); stroke-width:1.3; }
  .ah { fill:var(--muted); }
</style>
<rect class="bg" x="0" y="0" width="1100" height="725" rx="8"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="h" x="20" y="26">67 inputs, every tick</text>
<text class="h" x="555" y="26" text-anchor="middle">the network</text>
<text class="h" x="800" y="26" text-anchor="middle">3 outputs</text>
<text class="h" x="1005" y="26" text-anchor="middle">the plugin</text>
<rect class="box" x="20" y="40" width="290" height="54" rx="6"/>
<text class="t" x="32" y="62">How the car is moving</text>
<text class="n" x="300" y="62" text-anchor="end">0–3</text>
<text class="d" x="32" y="81">speed, sideways speed, yaw rate, slip angle</text>
<rect class="box" x="20" y="102" width="290" height="54" rx="6"/>
<text class="t" x="32" y="124">The racing line</text>
<text class="n" x="300" y="124" text-anchor="end">4–11, 44</text>
<text class="d" x="32" y="143">angle and distance to it, its turns 5 points ahead</text>
<rect class="box" x="20" y="164" width="290" height="54" rx="6"/>
<text class="t" x="32" y="186">Ray fan</text>
<text class="n" x="300" y="186" text-anchor="end">13–28</text>
<text class="d" x="32" y="205">15 rays to 60 m, aimed where it is sliding</text>
<rect class="box" x="20" y="226" width="290" height="54" rx="6"/>
<text class="t" x="32" y="248">Proximity pins</text>
<text class="n" x="300" y="248" text-anchor="end">29–34</text>
<text class="d" x="32" y="267">6 short rays fixed to the body, to 12 m</text>
<rect class="box" x="20" y="288" width="290" height="54" rx="6"/>
<text class="t" x="32" y="310">Room to the course edges</text>
<text class="n" x="300" y="310" text-anchor="end">46–51</text>
<text class="d" x="32" y="329">either side, here and 15 m / 30 m on</text>
<rect class="box" x="20" y="350" width="290" height="54" rx="6"/>
<text class="t" x="32" y="372">Last tick</text>
<text class="n" x="300" y="372" text-anchor="end">37–43, 45</text>
<text class="d" x="32" y="391">its steering, pedal, tire grip used, tick length</text>
<rect class="box" x="20" y="412" width="290" height="54" rx="6"/>
<text class="t" x="32" y="434">Settings</text>
<text class="n" x="300" y="434" text-anchor="end">12, 35</text>
<text class="d" x="32" y="453">speed ceiling, rear grip when sliding</text>
<rect class="abox" x="20" y="474" width="290" height="54" rx="6"/>
<text class="t" x="32" y="496">Pace</text>
<text class="n" x="300" y="496" text-anchor="end">52–54</text>
<text class="d" x="32" y="515">the pace asked, last brake, how far over it</text>
<rect class="abox" x="20" y="536" width="290" height="54" rx="6"/>
<text class="t" x="32" y="558">The car</text>
<text class="n" x="300" y="558" text-anchor="end">55–65</text>
<text class="d" x="32" y="577">its weight, geometry, tyres, engine, lock</text>
<rect class="abox" x="20" y="598" width="290" height="54" rx="6"/>
<text class="t" x="32" y="620">Skill</text>
<text class="n" x="300" y="620" text-anchor="end">66</text>
<text class="d" x="32" y="639">how good a driver to be, 0 to 1</text>
