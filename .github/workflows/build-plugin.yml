# Compiles the plugin against the AssettoServer version it is built for, on every push that touches
# it, so a C# mistake shows up here before anyone builds it by hand, and packages it as the download
# (a workflow artifact; release.yml calls it on a v* tag and attaches it to the draft release). The
# download's name and README say which AssettoServer version it is for. The plugin's .csproj
# references AssettoServer by relative path, so the plugin is placed inside an AssettoServer checkout
# as AssettoServer/GradientDriftPlugin/, as on a developer's machine.
name: build plugin

on:
  push:
    branches: [main]
    paths: ['GradientDriftPlugin/**', 'setup/gradientdrift_setup/identify.py', 'setup/gradientdrift_setup/plan.py', '.github/workflows/build-plugin.yml']
  pull_request:
    paths: ['GradientDriftPlugin/**', 'setup/gradientdrift_setup/identify.py', 'setup/gradientdrift_setup/plan.py', '.github/workflows/build-plugin.yml']
  workflow_dispatch:
  workflow_call:       # from release.yml on a v* tag
    outputs:
      package:
        value: ${{ jobs.build.outputs.package }}
      assettoserver:
        value: ${{ jobs.build.outputs.assettoserver }}

permissions:
  contents: read   # it only reads the code; release.yml makes the release

env:
  ASSETTOSERVER_REF: v0.0.54   # setup/gradientdrift_setup/identify.py TESTED_VERSION

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.name }}
      assettoserver: ${{ steps.version.outputs.assettoserver }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: gradient-drift
      - uses: actions/checkout@v5
        with:
          repository: compujuckel/AssettoServer
          ref: ${{ env.ASSETTOSERVER_REF }}
          path: AssettoServer
          fetch-depth: 0       # its build reads its version from git
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: place the plugin in the AssettoServer tree
        run: cp -r gradient-drift/GradientDriftPlugin AssettoServer/GradientDriftPlugin
      - name: build
        run: dotnet build AssettoServer/GradientDriftPlugin/GradientDriftPlugin.csproj -c Debug
      - name: the build has what the server loads
        run: |
          out=AssettoServer/GradientDriftPlugin/bin/Debug/net8.0
          ls -l $out/GradientDriftPlugin.dll $out/GradientDriftPlugin.deps.json $out/GradientDriftPlugin.policy.json
      - name: setup can tell what this build knows
        # setup reads the plugin's settings from the DLL's set_<Name> metadata strings (to take out
        # settings a newer plugin dropped), and replaces a server's policy only when a release shipped
        # it (SHIPPED_POLICIES): a release's own policy has to be on that list
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          out = 'AssettoServer/GradientDriftPlugin/bin/Debug/net8.0'
          dll = open(f'{out}/GradientDriftPlugin.dll', 'rb').read()
          cs = open('gradient-drift/GradientDriftPlugin/GradientDriftConfiguration.cs').read()
          keys = re.findall(r'public [\w<>?,\[\] ]+? (\w+) \{ get; set; \}', cs)
          lost = [k for k in keys if b'set_' + k.encode() + b'\0' not in dll]
          print(f'{len(keys)} settings; not found in the DLL: {lost}')
          assert keys and not lost, 'setup could not see these settings in the DLL'
          plan = open('gradient-drift/setup/gradientdrift_setup/plan.py').read()
          policy = open(f'{out}/GradientDriftPlugin.policy.json', 'rb').read().replace(b'\r\n', b'\n')
          sha = hashlib.sha256(policy).hexdigest()
          listed = sha in plan
          print(f'policy {sha}: {"in" if listed else "NOT in"} setup SHIPPED_POLICIES')
          if os.environ['GITHUB_REF'].startswith('refs/tags/v'):
              assert listed, 'add this policy to SHIPPED_POLICIES in setup/gradientdrift_setup/plan.py'
          elif not listed:
              print('::warning::the policy is not in setup SHIPPED_POLICIES yet (needed before a release)')
          PY
      - name: the plugin, setup and this build name the same AssettoServer version, the one it ran with
        id: version
        shell: pwsh
        run: |
          $want = "$env:ASSETTOSERVER_REF".TrimStart('v')
          $plugin = [regex]::Match((Get-Content -Raw gradient-drift/GradientDriftPlugin/GradientDriftPlugin.cs), 'BuiltForAssettoServer = "([^"]+)"').Groups[1].Value
          $setup = [regex]::Match((Get-Content -Raw gradient-drift/setup/gradientdrift_setup/identify.py), "TESTED_VERSION = '([^']+)'").Groups[1].Value
          # what the plugin reads at start: AssettoServer's informational version, "0.0.54+51737e2c2e"
          $info = (Get-ChildItem -Recurse AssettoServer/AssettoServer/bin -Filter AssettoServer.dll | Select-Object -First 1 | ForEach-Object { [Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName).ProductVersion })
          $running = [regex]::Match("$info", '^\d+\.\d+\.\d+').Value
          "workflow $want, plugin $plugin, setup $setup, AssettoServer.dll '$info'"
          if ($plugin -ne $want -or $setup -ne $want -or $running -ne $want) { throw "AssettoServer versions disagree" }
          "ASSETTOSERVER_VERSION=$want" >> $env:GITHUB_ENV
          "assettoserver=$want" >> $env:GITHUB_OUTPUT
      - name: package the download
        id: package
        run: |
          out=AssettoServer/GradientDriftPlugin/bin/Debug/net8.0
          version=$GITHUB_REF_NAME
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version=$(git -C gradient-drift rev-parse --short HEAD)
          name=GradientDriftPlugin-$version-for-AssettoServer-$ASSETTOSERVER_VERSION
          mkdir -p pkg/GradientDriftPlugin
          cp $out/GradientDriftPlugin.dll $out/GradientDriftPlugin.deps.json $out/GradientDriftPlugin.policy.json pkg/GradientDriftPlugin/
          cp gradient-drift/LICENSE gradient-drift/CREDITS.md pkg/
          cat > pkg/README.txt <<EOF
          Gradient Drift plugin $version, built for AssettoServer $ASSETTOSERVER_VERSION.

          The same files are for Windows and Linux servers (a .NET plugin, no native code), but it has
          been tested on Windows servers only so far.

          It is built and tested against AssettoServer $ASSETTOSERVER_VERSION only. On another version it
          says so in the server log at start, and the bots may misbehave: use the release made for your
          version, or build the plugin from the source against it.

          To install: put this GradientDriftPlugin folder beside the setup program (the release has
          it there already), and run setup on the server folder. It installs the plugin and makes the track data, car files and settings.

          Source, licence (AGPL-3.0, in LICENSE) and documentation:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY (built from commit $GITHUB_SHA)
          It builds on AssettoServer (AGPL-3.0); CREDITS.md lists what else it uses.
          EOF
          echo "name=$name" >> $GITHUB_OUTPUT
      # not on pull requests: the repository's artifact storage is small
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: pkg/
          retention-days: 3

