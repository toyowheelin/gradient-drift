# Builds the packaged setup app: a Windows zip (window + command line) and a Linux zip (command
# line only). Run it from the Actions tab ("Run workflow"); release.yml also calls it on a v* tag
# and attaches both zips to the draft release. The zips stay on the run page for 3 days;
# download them before then (a release keeps its own copy).
name: build setup

on:
  workflow_dispatch:
  workflow_call:   # from release.yml on a v* tag

permissions:
  contents: read   # release.yml makes the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r setup/requirements-build.txt
      - run: pyinstaller --noconfirm setup/gradient-drift-setup.spec
      - name: smoke test (from a terminal it is the command line)
        run: dist/gradient-drift-setup/gradient-drift-setup.exe --help
      - name: smoke test (the walk-through starts, and stops cleanly when its input ends)
        shell: bash
        run: |
          # it exits 1 when its input ends (stopped before the end), so only its output is checked
          echo | dist/gradient-drift-setup/gradient-drift-setup.exe walk > walk.txt || true
          cat walk.txt
          grep -q 'Where is Assetto Corsa installed' walk.txt
      - name: smoke test (the track tools it carries make a generated course's data)
        run: dist/gradient-drift-setup/gradient-drift-setup.exe selftest
      - name: the licences ship with it
        shell: bash
        run: test -s dist/gradient-drift-setup/THIRD_PARTY_NOTICES.txt && test -s dist/gradient-drift-setup/LICENSE && ls dist/gradient-drift-setup/licenses
      - name: smoke test (started like a double-click, with a console of its own, it opens the window)
        shell: pwsh
        run: |
          $p = Start-Process dist/gradient-drift-setup/gradient-drift-setup.exe -PassThru
          Start-Sleep 15
          $p.Refresh()
          if ($p.HasExited) { throw "setup exited instead of opening its window (code $($p.ExitCode))" }
          $title = $p.MainWindowTitle
          Stop-Process -Id $p.Id -Force
          if ($title -ne 'Gradient Drift Setup') { throw "expected the setup window, found '$title'" }
      - run: Compress-Archive -Path dist/gradient-drift-setup -DestinationPath gradient-drift-setup-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: gradient-drift-setup-windows
          path: gradient-drift-setup-windows.zip
          retention-days: 3   # ~140 MB each; the account's Actions storage is 500 MB

  linux:
    runs-on: ubuntu-latest
    # built on Debian 11 (glibc 2.31) so the program runs on older server distributions too
    container: python:3.12-slim-bullseye
    env:
      GRADIENTDRIFT_GUI: '0'
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends binutils zip
      - run: python -m pip install ruamel.yaml "prompt_toolkit>=3.0.52,<4" "pyinstaller>=6.10,<7" "numpy<2.5" numba pandas scipy
      - run: pyinstaller --noconfirm setup/gradient-drift-setup.spec
      - name: smoke test
        run: dist/gradient-drift-setup/gradient-drift-setup --help
      - name: smoke test (the walk-through starts, and stops cleanly when its input ends)
        run: |
          # it exits 1 when its input ends (stopped before the end), so only its output is checked
          echo | dist/gradient-drift-setup/gradient-drift-setup walk > walk.txt || true
          cat walk.txt
          grep -q 'Where is Assetto Corsa installed' walk.txt
      - name: smoke test (the track tools it carries make a generated course's data)
        run: dist/gradient-drift-setup/gradient-drift-setup selftest
      - name: the licences ship with it
        run: test -s dist/gradient-drift-setup/THIRD_PARTY_NOTICES.txt && test -s dist/gradient-drift-setup/LICENSE && ls dist/gradient-drift-setup/licenses
      - run: cd dist && zip -qr ../gradient-drift-setup-linux.zip gradient-drift-setup
      - uses: actions/upload-artifact@v5
        with:
          name: gradient-drift-setup-linux
          path: gradient-drift-setup-linux.zip
          retention-days: 3   # ~140 MB each; the account's Actions storage is 500 MB

